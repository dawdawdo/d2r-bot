# Bot configuration. Values marked "verify in M1" are assumptions until confirmed live.

game:
  window_title: "Diablo II: Resurrected"   # verify in M1
  exe:   # per platform (sys.platform)
    win32: "C:\\Program Files (x86)\\Diablo II Resurrected\\D2R.exe"  # direct launch, no Battle.net
    # GLaDOS: Steam shortcut (the Battle.net launcher, saved login) -> Battle.net.exe --exec="launch OSI"
    # in the same Proton prefix (bot/io/linux.py launch_game). OSI = D2R's Battle.net product code.
    linux: {steam_appid: 3949906016, proton: "Proton - Experimental", product: OSI}
  resolution: [1280, 720]                   # client area, windowed; verify in M1
  # Gamma applied to captured frames (1.0 = none). GLaDOS needs none once D2R's own Brightness is at max
  # (Settings "GammaHD" 3200; Settings.json isn't synced): raw frames then match the Windows fixtures.
  # A capture-side 0.70 was tried first (2026-11-08): it can't lift shadows without lifting tooltip boxes,
  # and LK chest tooltips merged into the dark scenery.
  capture_gamma: {win32: 1.0, linux: 1.0}
  # Extra wait after each mouse move / before every click: Proton shows a hover ~115 ms after the move,
  # the code's waits (0.07-0.09 s) were tuned on Windows. Without it LK chests got Glacial Spike, not a click.
  input_lag: {win32: 0.0, linux: 0.05}
  # Extra wait for a teleport to land on screen, on top of nav/lk TP_SETTLE. tools/tp_rate.py on GLaDOS,
  # VSync on: 0.30 s 10/10, 0.20 s 4/10. VSync OFF (now set on GLaDOS): 0.25/0.20 s 16/16, 0.16 s 9/16.
  # Windows: 0.15 s 10/10. Short settles made Durance hops look "stuck".
  frame_lag: {win32: 0.0, linux: 0.08}
  difficulty: hell
  character: Blizzaga
  route: blizzaga_hell                      # maps/<route>/route.yaml
  players: 7                                # /players N once per session (monsters weaker, chest loot same)
  meph_players: 1                           # /players before Level 3 (Stephen 2026-11-01); LK stays at players
  act4_exit: true                           # end clean runs in Act 4: next game spawns 1.6 s from the WP (A3: ~12 s)
  skip_terror: false                        # true = wait out a terrorized LK at the menu. Off 2026-11-03 (Stephen: she should handle it)

paths:
  save_dir:   # per platform (sys.platform)
    win32: "%USERPROFILE%\\Saved Games\\Diablo II Resurrected"
    # GLaDOS: D2R runs under Proton as a non-Steam game (compatdata id 3949906016)
    linux: "~/.steam/debian-installation/steamapps/compatdata/3949906016/pfx/drive_c/users/steamuser/Saved Games/Diablo II Resurrected"
  backups: backups
  logs: logs
  raw_frames: fixtures/raw
  failures: fixtures/failures

hotkeys:
  kill_switch: f12
  teleport: right_click          # Teleport bound to right-click skill
  # Skill hotkeys (each selects the right-click skill). Read from in-game tooltips 2026-10-25.
  # 2026-11-03 respec: Blizzard + Glacial Spike (no Frozen Orb). r/t = Call to Arms skills: only exist on the swap set.
  skills: {frozen_armor: q, energy_shield: w, static_field: e, blizzard: a, teleport: s, glacial_spike: d,
           ice_blast: f, battle_orders: r, battle_command: t}
  attack: glacial_spike                  # no cooldown: clears a pack on a chest, fights in LK (Blizzard has 1.8 s)
  buffs: [frozen_armor, energy_shield]   # cast at the town spawn every run
  swap_weapons: f6
  main_weapon_set: 2                     # inventory tab "II" = orb + shield; "I" = Call to Arms
  warcries: [battle_command, battle_orders]  # BC first (+1 to BO). Refused in town: cast on arrival outside it
  warcry_refresh_s: 75                   # Meph fight: cast again after this long (BO 90 s, BC 140 s at 2026-11-03 levels)
  potions: ["1", "2", "3", "4"]
  show_items: alt
  inventory: b

recording:  # training data for the learned-perception plan (fixtures/raw/sampled, fixtures/raw/danger); watch only
  enabled: true
  frame_every_s: 10      # one 640x360 frame this often while out of town
  frame_daily_cap: 3000
  calm_p: 0.0005         # per guard tick: chance to save a calm 5 s window (contrast for chickens/deaths)

safety:
  chicken_hp_pct: 50
  potion_hp_pct: 70
  potion_mp_pct: 25    # was 45 (2026-10-26 morning): burned all 98 stash rejuvs in a few hours
  potion_cooldown_s: 1.5
  es_broken_mp_pct: 8  # chicken if mana < 8% AND life < 75% (shield gone under attack)
  es_broken_hp_pct: 75
  flee_hp_pct: 60      # ES broken, no potion helps, life >= this: skip the camp (teleport to the next) instead of chicken
  flee_quiet_s: 4      # after fleeing, no second flee for this long (HP chicken still applies)
  hot_movers: 99       # DISABLED: nav.movers() counts orb shards/torch flicker as monsters (8-28 blobs
                       # even when calm). Needs a real monster detector before it can gate huts.
  run_timeout_s: 180      # Lower Kurast part of a run (clean runs take ~80-110 s there)

# Flip this one word: safe keeps her experience (Stephen 2026-11-06), fast gets more runs an hour. Takes effect at the
# next bot start. The levels below are merged over the rest of this file.
risk: safe
risk_levels:
  safe:
    meph:
      clear_before_loot: true    # Blizzard around the spot before going for the drop (about 12 s a kill)
      safety:
        chicken_hp_pct: 40
    town:
      refill_no_potions: false   # LK refill runs drink as usual
  fast:
    meph:
      clear_before_loot: false
      safety:
        chicken_hp_pct: 25       # was the setting until 2026-11-06
      after_kill:                # once he's dead: 82 of 175 drinks came while looting, only 2 of them below 40% life
        potion_hp_pct: 40
        potion_mp_pct: 25
    town:
      refill_no_potions: true    # LK refill runs flee or chicken instead of drinking. About 20 rejuvs an hour, not 16,
                                 # but she died once in 90 of those runs (2026-11-06 20:49, 48% life, dead within 3 s)

meph:                   # the Mephisto task (bot/tasks/meph.py, moat trick from the dock)
  spot: south           # south = the bottom bank (Stephen's spot, no Council hunt); dock = the north-east dock
  buy_mana: false       # NEVER (Stephen 2026-11-08: red/blue potions aren't useful; don't buy, the belt's are drunk in town)
                        # true = fill empty belt columns with Ormus mana potions (option C). Off 2026-11-02: the Materials
                        # rejuv stack is full (99) and spares were being dropped; rejuvs fix life AND mana (Mana Burn)
  buy_mana_when_dry: false  # true = stash out of rejuvs: buy at Ormus and keep killing him instead of LK refill runs.
                            # Stephen 2026-11-08: no, "do LK runs until she stocks up again. Then go back to Mephisto"
  fight_parked: true    # fight him in the top centre instead of giving up the game (2026-11-03 test: bot/meph.py)
  timeout_s: 420        # Durance 2 waypoint -> kill -> loot (300 cut a fight at 48%, 2026-11-02)
  safety:               # replaces `safety` keys during the fight (chicken_hp_pct: see risk_levels; 74% light res)
    es_broken_hp_pct: 0
    potion_hp_pct: 60
    potion_mp_pct: 50

loot:
  # The in-game filter (filters/LK Bot.fltr) hides everything except what docs/loot.md lists; the bot then picks up
  # visible labels of these colors. Which uniques and sets show is decided only there, per base code:
  # tools/chronicle_filter.py regenerates it from the Chronicle. No item list to keep in step here.
  filter_name: "LK Bot"
  chronicle_tables: 'D:/Google_Drive/Projects/D2R_Bot_20260314/Codebase/armory_tools/scanbundle.tgz'
  pick: [rune, unique, set, magic, gray]  # magic = blue labels that say "Charm"; gray = socketed/eth bases
  supplies: [rejuv, key]          # white labels picked when needed (belt slot empty / keys < keys_full)
  rejuv_spares: true             # also pick rejuvs with the belt full, for the stash (Stephen 2026-11-02: fine)
  pick_white_other: true         # white labels that aren't keys/rejuvs = gems, skulls, runeword bases (filter rules)

# Named click points, client coords at 1280x720. Verified live 2026-10-25.
ui:
  play: [640, 640]
  offline_tab: [1184, 34]      # character list tab; D2R opens on Online when started through Battle.net (GLaDOS)
  difficulty_normal: [636, 300]
  difficulty_nightmare: [636, 346]
  difficulty_hell: [636, 390]
  save_and_exit: [640, 314]
  esc_loot_filter: [640, 420]
  wp_lower_kurast: [190, 314]  # waypoint panel, Act III tab (default when in A3)
  wp_tab_act3: [224, 90]       # waypoint panel act tabs (live 2026-10-27); the panel opens on the current act
  wp_tab_act4: [292, 90]
  wp_town: [240, 128]          # first entry of a tab = its town (Kurast Docks, Pandemonium Fortress)
  wp_durance_2: [240, 508]     # Act III tab, last entry: Durance of Hate Level 2
  exit_game: [165, 430]        # main menu "Exit Diablo II"

# M3: walking route from the new-game spawn (by Meshif) to the waypoint, recorded 2026-10-25.
town:
  refill_rejuvs: 40     # stash dry in a boss session: LK until this many are stashed, then bosses again (0 = off)
  route: [[1180, 330], [773, 170], [900, 160], [1050, 170], [810, 250], [1180, 420], [1150, 200]]
  # View displacement of each leg by odometry (median of clean runs 2026-10-26): walk_chain walks these
  # without stopping. Remove to go back to leg-by-leg walking.
  route_disp: [[498, -19], [287, -124], [345, -172], [422, -191], [193, -115], [498, 77], [536, -153]]
  wp_template: town_wp.png       # platform + right brazier
  wp_click_offset: [35, 40]      # template top-left -> platform center
  wp_threshold: 0.7
  wp_typical: [1051, 356]        # WP template top-left at a normal route end (2026-10-26); route end reference
  corpse_click: [638, 334]       # character's feet at spawn (where the corpse lies after a death)
  heal_below_pct: 70             # at spawn: below this, detour to Ormus, then start a fresh game
  ormus_after_leg: 4             # Ormus wanders the plaza visible after the first 4 route legs
  ormus_region: [300, 40, 860, 480]
  ormus:                         # Meph runs: buy mana potions (trade window opens on Misc)
    trade_offset: [37, 55]       # "Trade" relative to the npc_ormus.png match (dialog line 2; live 2026-11-01)
    mana_potion: [395, 376]      # Misc tab, right column, bottom: his best mana potion
    healing_potion: [395, 262]   # Misc tab, right column: his best healing potion (last red one)
  repair_every: 60               # backstop: repair at Hratli at least this often (Stephen: armor ran low)
  repair_after_wear: 20           # runs between the first wear seen and the repair
  durability_every: 10           # check every equipped item's durability (tooltips) this often; repair if any is
                                 # below full (2026-10-27: nothing lost in 10 runs, Shako 12/12, Viper 24/24)
  keys_min: 3                    # buy keys at Hratli when the estimate is <= this (Stephen)
  keys_full: 12                  # a bought stack tops the inventory keys up to this
  a4_wp_template: a4_wp.png      # Pandemonium Fortress WP (braziers + platform), seen from the A4 spawn
  a4_wp_region: [880, 0, 280, 160]
  a4_wp_click_offset: [90, 55]   # template top-left -> platform center
  keys_pick_below: 8             # pick keys from chests only below this estimate (drops are stacks of several)
  hratli:                        # legs after the Ormus legs: E across the plaza, SE bridge, landing, NE bridge
    route: [[1000, 560], [1150, 380], [1040, 480], [900, 470], [860, 510], [900, 540], [1118, 262], [880, 220], [1000, 170]]
    region: [600, 60, 500, 300]  # where Hratli stands at the end of the route
    trade_offset: [37, 58]       # "Trade/Repair" relative to the npc_hratli.png match
    repair_all: [362, 516]       # trade window: right anvil button ("Repair all equipment")
    misc_tab: [370, 77]          # trade window tabs: Armor, Weapons, Weapons, Misc
    key: [395, 110]              # Misc tab: Key (shift+right-click buys a stack)
  asheara:                       # merc revive. Legs after the Ormus legs: NW along the boardwalk into her hut
    route: [[640, 100], [420, 180], [340, 200], [300, 200], [330, 190], [410, 135]]
    region: [300, 120, 500, 260]   # where she wanders inside the hut at the end of the route
    resurrect_offset: [38, 53]     # "Resurrect <merc>" relative to the npc_asheara.png match (dialog line 2)
  merc_region: [0, 0, 78, 74]    # merc portrait (top-left) shows only while the merc is alive

debug_loot_frames: false        # save the first loot-scan frame of each chest to fixtures/raw/

# Stash: right next to the town WP; visible at the end of the town route.
stash:
  click: [420, 190]             # stash chest, screen coords at the end of the town route
  materials_tab: [280, 66]
  rejuv_slots: [[57, 250], [96, 250]]  # Materials tab potion row: Full Rejuvs, then Rejuvs (stash out of Full 2026-10-26)
  max_potions: 16
  runes_tab: [370, 70]
  shared_tab: [145, 70]         # stowaway: unique rings go to shared page 1; runes auto-route to the Runes tab
  shared_next_page: [283, 486]  # the arrows beside "Page 1 / 5"
  shared_prev_page: [164, 486]
  gold_button: [167, 533]       # shared tab: the gold amount under the grid opens "Withdraw" (live 2026-11-01)
  withdraw_ok: [577, 387]
  withdraw_gold: 200000         # Blizzaga carries ~0 and her own stash ~18k; a merc revive costs 50k
  personal_tab: [70, 70]        # stowaway: charms (blue tooltip name) go to Blizzaga's own page
  gems_tab: [190, 70]

# Cubing at the stash (bot/cubing.py, bot/cube.py; Stephen 2026-11-07): keep 5 of each lower gem and rune,
# runes up through Fal; gems that rune recipes take are saved for them
cube:
  enabled: true
  every_hours: 6                # on the way through town, once this long after the last time
  keep: 5
  gem_keep: 0                   # rune recipes may use their gem (Chipped Amethyst for Amn...) down to none: runes first, then gems (Stephen 2026-11-09)
  top_rune: Fal
  top_grade: Perfect            # Stephen 2026-11-07: also 3 flawless -> 1 perfect
  max_transmutes: 200

# Inventory (bot/vision/inventory.py). Stephen's own items stay put: [col, row, w, h] rectangles.
# Recorded 2026-11-03 (after the respec): charms/tomes/cube fill cols 4-9, the skull and 2 small charms col 3 rows 1-3.
# The key stack sits at col 3 row 0: keep it out of these rectangles or it can't be counted.
# Update this if he rearranges the inventory (anything outside it that isn't a key gets stashed).
inventory:
  protected: [[4, 0, 6, 4], [3, 1, 1, 3]]
  equipment:                     # hover points of equipped items (inventory open)
    helm: [1055, 105]
    armor: [1055, 225]
    weapon: [1205, 170]
    shield: [910, 170]
    gloves: [910, 300]
    boots: [1205, 300]
    belt: [1055, 315]

capture:
  fps: 2                      # tools/capture.py interval mode

# Perception. All regions are client-relative [x, y, w, h] at 1280x720.
# CALIBRATE in M1 from real frames â€” current numbers are educated guesses.
vision:
  orbs:
    # Measured 2026-10-25 (tools/orb_probe.py): full liquid top y 611, centers x 328 / 988.
    # The effective bottom is y 711 (hidden by the orb frame): 350/635 HP (55%) has its top at y 656.
    hp:
      region: [308, 611, 40, 100]
      color:
        - {lo: [170, 120, 60], hi: [8, 255, 255]}        # red, hue wraps
        - {lo: [40, 120, 60], hi: [75, 255, 255]}        # green = poisoned
    mp:
      region: [968, 611, 40, 100]
      color: {lo: [105, 120, 60], hi: [130, 255, 255]}   # blue
  belt:   # visible belt row, slot centers for keys 1-4 (measured 2026-10-25)
    x: [744, 786, 828, 869]
    y: [695, 720]
  labels:
    # D2R text colors: unique = muted gold, rune = saturated orange, set = bright green.
    unique: {lo: [15, 60, 120], hi: [28, 165, 255]}
    rune:   {lo: [12, 200, 180], hi: [24, 255, 255]}
    set:    {lo: [50, 150, 150], hi: [70, 255, 255]}
    magic:  {lo: [116, 80, 170], hi: [124, 165, 255]}    # blue (255,136,136 BGR) in tooltips 2026-10-31: charms
    white:  {lo: [0, 0, 200], hi: [179, 30, 255]}        # gold, gems, normal items (testing only)
    # gray = socketed or ethereal items (Stephen's runeword bases, e.g. Archon Plate). Not yet seen live: the range is
    # a guess around D2R's gray (~105-140), checked to stay off 4939 saved frames' item area. First picks save
    # fixtures/raw/pick_gray_*.png: check those and narrow the range. Name text (merc, monster bar) is masked in loot().
    gray:   {lo: [0, 0, 80], hi: [179, 35, 165]}
  label_ignore:                   # HUD (bottom bar + orbs), the clock (top right), life/mana text
    - [0, 595, 1280, 125]
    - [1040, 10, 240, 110]         # clock + zone lines (Durance 3 shows a gold boss-mod line, 2026-11-01)
    - [180, 565, 230, 30]
    - [880, 565, 230, 30]
    - [0, 420, 420, 150]           # chat messages (Terror Zone notices have orange = rune-colored text)
  # Screen states: list of cues {template, region, threshold}; templates live in
  # bot/assets/templates/. Checked in order; first full match wins.
  states:
    title:
      - {template: title.png, region: [450, 540, 380, 80], threshold: 0.8}
    difficulty:
      # the opaque Hell button: the "Select Difficulty" title is see-through (failed over the A4 menu background)
      - {template: difficulty_hell.png, region: [570, 350, 140, 80], threshold: 0.8}
    esc_menu:   # the opaque "Save and Exit" button text (the "Paused" title is see-through)
      - {template: esc_menu.png, region: [573, 296, 134, 42], threshold: 0.8}
    wp_menu:
      - {template: wp_menu.png, region: [45, 5, 360, 60], threshold: 0.8}
    main_menu:
      - {template: main_menu.png, region: [25, 400, 210, 85], threshold: 0.8}
    in_game:
      - {template: in_game.png, region: [160, 600, 100, 120], threshold: 0.8}

# Web page (python -m bot.web): start/stop tasks from a browser. 127.0.0.1 = this PC only;
# 0.0.0.0 = also from the phone on home Wi-Fi (Windows asks once to allow it through the firewall).
# The password is in logs/web_password.txt (created on first start).
web:
  host: 127.0.0.1
  port: 8765
